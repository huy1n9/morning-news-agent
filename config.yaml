# 每日早报 Agent 配置文件
#
# 聚焦国内中文新闻源，与 DeepSeek 模型配合最佳

news:
  sources:
    # ── 科技资讯 ──
    - name: "IT之家"
      url: "https://www.ithome.com/rss/"
    - name: "36氪"
      url: "https://36kr.com/feed"
    - name: "少数派"
      url: "https://sspai.com/feed"
    - name: "开源中国"
      url: "https://www.oschina.net/news/rss"
    - name: "InfoQ 中文"
      url: "https://www.infoq.cn/feed"
    - name: "虎嗅网"
      url: "https://rss.huxiu.com/"
    - name: "极客公园"
      url: "https://www.geekpark.net/rss"
    - name: "爱范儿"
      url: "https://www.ifanr.com/feed"
    - name: "机器之心"
      url: "https://www.jiqizhixin.com/rss"
    - name: "Solidot"
      url: "https://www.solidot.org/index.rss"

    # ── 综合新闻 ──
    - name: "澎湃新闻"
      url: "https://feedx.net/rss/thepaper.xml"
    - name: "新华网"
      url: "http://rss.xinhuanet.com/rss/native.xml"
    - name: "网易新闻"
      url: "http://news.163.com/special/00011K6L/rss_newsattitude.xml"

    # ── 财经 ──
    - name: "华尔街见闻"
      url: "https://rsshub.app/wallstreetcn/global"
    - name: "雪球"
      url: "https://xueqiu.com/hots/topic/rss"
    - name: "FT中文网"
      url: "http://feeds.feedburner.com/FTCNFull"

    # ── 国际 ──
    - name: "BBC中文"
      url: "https://feeds.bbci.co.uk/zhongwen/trad/rss.xml"
    - name: "德国之声"
      url: "https://rss.dw.com/xml/rss-zt-all"
    - name: "联合早报"
      url: "https://rsshub.app/zaobao/realtime/china"

  # 每个源最多获取条数
  max_per_source: 25
  # 总共最多保留条数（去重后）
  max_total: 80

deepseek:
  # 模型：deepseek-v4-pro（最强）/ deepseek-v4-flash（更快更便宜）
  model: "deepseek-v4-flash"
  max_tokens: 8192
  temperature: 0.3

email:
  # 发件人 & 收件人（可在 .env 中覆盖）
  subject_template: "每日早报 - {date}"
  # 是否发送纯文本备选（当 HTML 邮件客户端不支持时）
  send_plain_text_fallback: true

# 日志配置
logging:
  level: "INFO"  # DEBUG / INFO / WARNING / ERROR
  file: "logs/morning-news.log"
